# Publishes a release when a version tag is pushed: git tag v0.2.0 && git push origin v0.2.0
# Needs two repository secrets:
#   HOMEBREW_TAP_TOKEN  a token that can write to ZenixBit/homebrew-tap
#   SIGNING_KEY         the armored GPG private key that signs the RPMs and the APT/RPM repositories
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload its assets

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the changelog needs the full history and tags

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check the VERSION file matches the tag
        run: |
          test "v$(tr -d '[:space:]' < VERSION)" = "$GITHUB_REF_NAME" ||
            { echo "::error::VERSION is $(cat VERSION) but the tag is $GITHUB_REF_NAME"; exit 1; }

      - name: Import the signing key
        id: key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY" || { echo "::error::the SIGNING_KEY secret is not set"; exit 1; }
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/signing-key.asc"
          gpg --batch --quiet --import "$RUNNER_TEMP/signing-key.asc"
          echo "id=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')" >> "$GITHUB_OUTPUT"

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SIGNING_KEY_FILE: ${{ runner.temp }}/signing-key.asc

      # apt and dnf repositories on GitHub Pages (https://tonmoytalukder.github.io/werkz/).
      # Pre-releases (tags with a "-", like v0.3.0-rc.1) are left out.
      - name: Check out the Pages branch
        if: ${{ !contains(github.ref_name, '-') }}
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Update the apt and dnf repositories
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          SIGNING_KEY_ID: ${{ steps.key.outputs.id }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils createrepo-c
          packaging/repos/build-repos.sh dist site
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "packages for $GITHUB_REF_NAME"
          # the pages workflow may publish the site at the same moment: retry on top of it
          for i in 1 2 3; do git push -q origin gh-pages && exit 0; git pull -q --rebase origin gh-pages; done
          exit 1

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/signing-key.asc"
